# Publie le dossier app/ sur GitHub Pages à chaque envoi sur main
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Régénère app/data.js depuis les CSV : le site publié suit toujours les données
      - run: python scripts/preparer_donnees.py
      # GitHub Pages garde chaque fichier 10 min en cache : les CSS et JS locaux prennent le commit dans leur adresse,
      # pour qu'une page neuve ne tourne jamais avec le style.css ou l'app.js de la version d'avant
      - run: |
          sed -i -E "s/(href|src)=\"([^\":]+\.(css|js))\"/\1=\"\2?v=${GITHUB_SHA::8}\"/g" app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploiement
        uses: actions/deploy-pages@v4
